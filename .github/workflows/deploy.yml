name: 构建与部署

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 需要写 Release

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建单文件站点
        run: npm run build

      - name: 导出 PDF
        id: pdf
        run: |
          set -o pipefail
          npm run pdf 2>&1 | tee /tmp/pdf.log
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # 失败时把日志传到 Release，方便直接下载查看（公开仓库不需要登录）
      - name: 上传失败日志
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "AI 时代的机遇和挑战：今天的学生，如何走向明天的世界"
        run: |
          tail -200 /tmp/pdf.log > release/ci-error.log 2>/dev/null || echo "no log" > release/ci-error.log
          gh release view pdf-latest >/dev/null 2>&1 ||
            gh release create pdf-latest --title "$TITLE" --notes "由 GitHub Actions 自动构建。" --latest
          gh release upload pdf-latest release/ci-error.log --clobber

      # 固定一个 release（tag: pdf-latest），每次覆盖里面的 PDF
      - name: 更新 PDF Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "AI 时代的机遇和挑战：今天的学生，如何走向明天的世界"
        run: |
          PDF="release/$TITLE.pdf"

          gh release view pdf-latest >/dev/null 2>&1 ||
            gh release create pdf-latest --title "$TITLE" --notes "由 GitHub Actions 自动构建，每次 push 到 main 覆盖更新。" --latest
          gh release edit pdf-latest --title "$TITLE" --latest

          rel_id=$(gh api "repos/$GH_REPO/releases/tags/pdf-latest" --jq .id)
          # 清掉旧资产，保证每次只有一个 PDF
          for aid in $(gh api "repos/$GH_REPO/releases/$rel_id/assets" --jq '.[].id'); do
            gh api -X DELETE "repos/$GH_REPO/releases/assets/$aid"
          done
          # gh release upload 会把中文名截断，这里走 API 显式指定资产名
          name=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$(basename "$PDF")")
          gh api -X POST -H "Content-Type: application/pdf" \
            "repos/$GH_REPO/releases/$rel_id/assets?name=$name" --input "$PDF"

      # 没配 Cloudflare 密钥时跳过部署，保证 PDF 依然能发出去
      - name: 检查部署密钥
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN，本次跳过 Cloudflare 部署"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 部署到 Cloudflare Workers
        if: steps.cf.outputs.ready == 'true'
        run: npx void deploy --platform cloudflare --dir release/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
