name: 构建与部署

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 临时：用于删除旧的 PDF Release

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # PDF 已改由 GitHub Pages 分发（那边能保留中文文件名），旧 Release 清理掉
      - name: 删除旧 PDF Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete pdf-latest --yes --cleanup-tag

      - name: 构建单文件站点
        run: npm run build

      - name: 导出 PDF
        run: npm run pdf
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # 没配 Cloudflare 密钥时跳过部署
      - name: 检查部署密钥
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN，本次跳过 Cloudflare 部署"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 部署到 Cloudflare Workers
        if: steps.cf.outputs.ready == 'true'
        run: npx void deploy --platform cloudflare --dir release/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # GitHub Pages：国内可访问，PDF 用中文文件名
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 构建单文件站点
        run: npm run build

      - name: 导出 PDF
        run: npm run pdf
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/site

      - id: deployment
        uses: actions/deploy-pages@v4
