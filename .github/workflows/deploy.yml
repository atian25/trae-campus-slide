name: 构建与部署

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 安装思源黑体
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip fonts-noto-color-emoji
          curl -sSL --retry 3 -o /tmp/shs.zip \
            https://github.com/adobe-fonts/source-han-sans/releases/download/2.005R/09_SourceHanSansSC.zip
          sudo mkdir -p /usr/share/fonts/opentype/source-han-sans
          sudo unzip -oq /tmp/shs.zip -d /usr/share/fonts/opentype/source-han-sans
          sudo fc-cache -f
          fc-list | grep -i "source han" | head -3

      - name: 构建站点与 PDF
        run: npm run site
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/site

      - id: deployment
        uses: actions/deploy-pages@v4
