<!-- @dsCard group="Layouts" width=960 height=540 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Cover — 封面版式</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; background: #F7F8F5; }
  .stage { width: 960px; height: 540px; overflow: hidden; position: relative; }
  .page {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform: scale(.5); transform-origin: 0 0; overflow: hidden;
    background: var(--surface, #F7F8F5); color: var(--text-ink, #141C18);
    font-family: var(--font-sans, 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Source Han Sans SC', system-ui, sans-serif);
    padding: 0 115px; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
</style>
</head>
<body>
<div class="stage">
<div class="page">

  <!-- 左上 wordmark：本系统不分发 TRAE logo，用文字替身 -->
  <div style="position:absolute;left:115px;top:65px;display:flex;align-items:center;gap:12px">
    <div style="width:13px;height:13px;border-radius:var(--radius-pill,999px);background:var(--accent-brand,#2FAE72)"></div>
    <p style="margin:0;font-size:30px;line-height:1;font-weight:800;letter-spacing:1.2px;color:var(--text-ink-deep,#0B3A29)">TRAE</p>
    <p style="margin:0;font-size:30px;line-height:1;font-weight:600;letter-spacing:2.4px;color:var(--accent-eyebrow,#3C6B52)">CAMPUS</p>
  </div>

  <!-- 封面主体：标题块 + 讲者 pill，左移 360 留出右侧插画位 -->
  <div style="display:flex;flex-direction:column;gap:120px;padding-left:360px">

    <div style="display:flex;flex-direction:column;gap:31px;align-items:flex-start">
      <h1 style="margin:0;font-size:104px;line-height:1.2;letter-spacing:-3px;font-weight:800;color:var(--text-ink,#141C18)">AI 时代的<span style="color:var(--accent-brand-deep,#17754A)">机遇</span>和<span style="color:var(--accent-brand-deep,#17754A)">挑战</span></h1>
      <p style="margin:0 0 0 86px;font-size:41px;line-height:1.4;letter-spacing:-0.6px;font-weight:800;color:var(--text-body-soft,#4A544E)">— 今天的学生，如何走向明天的世界</p>
    </div>

    <div style="align-self:flex-start;display:flex;align-items:center;gap:12px;background:var(--surface-mint,#DFF1E6);border-radius:var(--radius-pill,999px);padding:17px 48px">
      <div style="width:13px;height:13px;border-radius:var(--radius-pill,999px);background:var(--accent-brand,#2FAE72)"></div>
      <p style="margin:0;font-size:41px;line-height:1;font-weight:800;letter-spacing:-0.7px;color:var(--text-ink-deep,#0B3A29)">天猪</p>
      <p style="margin:0 0 0 12px;font-size:24px;line-height:1;font-weight:600;letter-spacing:2.4px;color:var(--accent-eyebrow,#3C6B52)">讲者</p>
    </div>

  </div>

  <!-- 右侧插画位（780×520）：本系统不分发小助手插画，这里用品牌色块占位 -->
  <div style="position:absolute;right:0;bottom:0;width:560px;height:460px;background:var(--surface-inverse,#0B3A29);border-radius:22px 0 0 0">
    <div style="position:absolute;right:70px;bottom:240px;width:180px;height:180px;border-radius:var(--radius-pill,999px);background:var(--accent-mint,#BFF2D2)"></div>
    <div style="position:absolute;right:340px;bottom:80px;width:200px;height:56px;border-radius:var(--radius-pill,999px);background:var(--accent-mint,#BFF2D2)"></div>
    <div style="position:absolute;right:250px;bottom:80px;width:72px;height:72px;border-radius:var(--radius-pill,999px);background:var(--accent-brand,#2FAE72)"></div>
  </div>
  <div style="position:absolute;right:560px;bottom:0;width:160px;height:160px;border-radius:22px 0 0 0;background:var(--surface-card,#EAECEA)"></div>

</div>
</div>
</body>
</html>
