<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TRAE Campus — Cover</title>
<link rel="stylesheet" href="../../tokens.css">
</head>
<body style="margin:0;background:transparent;font-family:var(--font-sans)">
<div style="width:480px;height:270px;overflow:hidden;position:relative">
  <!-- 1920×1080 canvas, scaled to 25%: 480×270 -->
  <div style="position:absolute;top:0;left:0;width:1920px;height:1080px;transform:scale(0.25);transform-origin:top left;box-sizing:border-box;background:var(--surface);color:var(--text-ink);font-family:var(--font-sans);padding:0 115px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden">

    <!-- 字标占位：TRAE logo 不随本系统分发，这里用纯文字代替 138×46 的 logo 位 -->
    <p style="margin:0;position:absolute;left:115px;top:74px;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:2.4px;color:var(--text-heading)">TRAE CAMPUS</p>

    <div style="display:flex;flex-direction:column;align-items:flex-start;padding-left:360px">
      <h1 style="margin:0;font-size:104px;line-height:1.22;font-weight:800;letter-spacing:-3px;color:var(--text-ink)">AI 时代的<span style="color:var(--accent-text)">机遇</span>和<span style="color:var(--accent-text)">挑战</span></h1>
      <p style="margin:0;font-size:41px;line-height:1.2;font-weight:400;color:var(--text-body-soft);padding-top:31px;padding-left:86px">— 今天的学生，如何走向明天的世界</p>
      <div style="padding-top:120px">
        <!-- 名签 334×167：左侧 190×167 是讲者照片位（不随本系统分发），预览里保持留白 -->
        <div style="width:334px;height:167px;display:flex;flex-direction:column;justify-content:flex-end">
          <div style="box-sizing:border-box;width:334px;background:var(--surface-mint);border-radius:var(--radius-pill);padding:17px 48px;display:flex;align-items:center;justify-content:center">
            <p style="margin:0;font-size:41px;line-height:1.2;font-weight:800;letter-spacing:-0.8px;color:var(--text-heading)">天猪</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
