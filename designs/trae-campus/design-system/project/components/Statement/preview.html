<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TRAE Campus — Statement</title>
<link rel="stylesheet" href="../../tokens.css">
</head>
<body style="margin:0;background:transparent;font-family:var(--font-sans)">
<div style="width:480px;height:270px;overflow:hidden;position:relative">
  <!-- 1920×1080 canvas, scaled to 25%: 480×270 -->
  <div style="position:absolute;top:0;left:0;width:1920px;height:1080px;transform:scale(0.25);transform-origin:top left;box-sizing:border-box;background:var(--surface-inverse);color:var(--inverse-text);font-family:var(--font-sans);padding:67px 77px 62px 77px;display:flex;flex-direction:column;gap:41px">

    <!-- top label -->
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:13px;height:13px;border-radius:50%;background:var(--accent-brand)"></div>
      <p style="margin:0;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:2.4px;color:var(--inverse-label)">TRAE CAMPUS · 高校分享</p>
    </div>

    <!-- statement body: one big line, one quote -->
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <h1 style="margin:0;font-size:104px;line-height:1.22;font-weight:800;letter-spacing:-3px;color:var(--inverse-text)">自然选择号，前进四！</h1>
      <p style="margin:0;font-size:24px;line-height:1.7;font-weight:400;color:var(--inverse-label);padding-top:26px">仰望星空，保持终身学习的心态。</p>
      <p style="margin:0;font-size:30px;line-height:1.55;color:var(--neutral-graphic);padding-top:41px">↓</p>
      <div style="display:flex;flex-direction:column;border-left:3px solid var(--accent-brand);padding-left:31px;padding-top:41px">
        <p style="margin:0;font-size:30px;line-height:1.55;font-weight:800;letter-spacing:-0.4px;color:var(--inverse-text)">调整好心态，不要逃避，也不要气馁。即使身处行业前沿，我们这几年也一直在愚昧之巅和绝望之谷之间徘徊。很多问题，我们同样没有答案，也只能一边实践，一边修正自己的判断。大势所趋，唯有奋楫向前。</p>
        <p style="margin:0;font-size:24px;line-height:1.7;font-weight:400;color:var(--inverse-label);padding-top:22px">—— 天猪</p>
      </div>
    </div>

  </div>
</div>
</body>
</html>
